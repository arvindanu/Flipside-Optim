<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" role="img" aria-label="Flipside game. Tap to flip gravity and dodge the obstacles."></canvas>
  <div class="overlay" id="overlay">
    <h1 class="title" id="ovTitle" aria-label="Flipside">Flip<span class="flipped">side</span></h1>
    <p class="lede" id="ovText" hidden></p>
    <div class="stats" id="ovStats" hidden></div>
    <div class="actions">
      <button class="btn" id="ovBtn" type="button">Play</button>
      <button class="btn alt" id="ovMaps" type="button" hidden>Maps</button>
      <button class="btn alt" id="ovSound" type="button" hidden>Sound on</button>
    </div>
    <div class="homemenu" id="homeMenu" hidden>
      <button class="tile" id="homeMaps" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg><span>Maps</span></button>
      <button class="tile" id="homeSprites" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5" fill="currentColor"/><circle cx="9.4" cy="11.2" r="1.8" fill="var(--deep)"/><circle cx="14.6" cy="11.2" r="1.8" fill="var(--deep)"/></svg><span>Sprites</span></button>
      <button class="tile" id="homeSettings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="12" cy="12" r="6.3" fill="none" stroke="currentColor" stroke-width="3.4"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(0 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(45 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(90 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(135 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(180 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(225 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(270 12 12)"/><rect x="10.4" y="1.4" width="3.2" height="4.2" rx="1" transform="rotate(315 12 12)"/></g></svg><span>Settings</span></button>
    </div>
  </div>

  <!-- Map selection: shown after the title screen, and from the game-over screen -->
  <div class="overlay maps" id="mapOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Choose a map</h2>
      <div class="maptotal" aria-live="polite">
        <span class="lab">Points</span>
        <span class="num" id="mapTotal">0</span>
      </div>
      <div class="maplist" id="mapList" role="radiogroup" aria-label="Maps"></div>
      <p class="mapmsg" id="mapMsg" aria-live="polite"></p>
      <div class="actions">
        <button class="btn" id="mapPlay" type="button">Play</button>
        <button class="btn alt" id="mapBack" type="button">Back</button>
      </div>
    </div>
  </div>

  <!-- Sprites: cosmetic player skins -->
  <div class="overlay maps" id="spriteOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Sprites</h2>
      <div class="maptotal" aria-live="polite">
        <span class="lab">Points</span>
        <span class="num" id="spriteTotal">0</span>
      </div>
      <div class="spritelist" id="spriteList" role="radiogroup" aria-label="Sprites"></div>
      <p class="mapmsg" id="spriteMsg" aria-live="polite"></p>
      <div class="actions">
        <button class="btn alt" id="spriteBack" type="button">Back</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay maps" id="settingsOverlay" hidden>
    <div class="mapwrap">
      <h2 class="title sm">Settings</h2>
      <div class="setlist">
        <div class="setrow">
          <div class="setinfo">
            <span class="setname" id="setSoundName">Sound</span>
            <span class="setdesc" id="setSoundDesc">Music and sound effects</span>
          </div>
          <button class="switch on" id="setSound" type="button" role="switch" aria-checked="true" aria-labelledby="setSoundName"><span id="setSoundLbl">On</span></button>
        </div>
        <div class="setrow">
          <div class="setinfo">
            <span class="setname" id="setMusicName">Music</span>
            <span class="setdesc" id="setMusicDesc">Turn off to keep sound effects only</span>
          </div>
          <button class="switch on" id="setMusic" type="button" role="switch" aria-checked="true" aria-labelledby="setMusicName"><span id="setMusicLbl">On</span></button>
        </div>
      </div>
      <div class="actions">
        <button class="btn alt" id="setBack" type="button">Back</button>
      </div>
    </div>
  </div>
</div>

<button class="pausebtn" id="pauseBtn" type="button" aria-label="Pause" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/>
    <rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/>
  </svg>
</button>
<button class="boostbtn ready" id="boostBtn" type="button" aria-label="Boost, ready" hidden>
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="46"/>
    <circle class="prog" id="boostRing" cx="50" cy="50" r="46"/>
  </svg>
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M12 1.5c3.2 2.6 4.6 6 4.6 9.6V16l-2.2 2.2H9.6L7.4 16v-4.9C7.4 7.5 8.8 4.1 12 1.5z"/>
    <path fill="currentColor" d="M7.2 12.6 3.8 16.4V19l3.6-1.8zM16.8 12.6l3.4 3.8V19l-3.6-1.8z"/>
    <path fill="currentColor" d="M9.8 19.4c0 1.6.8 2.6 2.2 3.2 1.4-.6 2.2-1.6 2.2-3.2z"/>
    <circle cx="12" cy="9.6" r="2" fill="#141A7A"/>
  </svg>
  <span class="lbl" id="boostLbl">BOOST</span>
</button>
<div class="probe" id="probe" aria-hidden="true"></div>

<!-- Splash screen -->
<div class="splash" id="splash"><img id="splashImg" alt="Made by TerMorgan" src="assets/splash.jpg"></div>

<script src="https://www.youtube.com/game_api/v1"></script>
<script src="js/game.js"></script>
</body>
</html>
